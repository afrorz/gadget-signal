# ── クラウドファンディング収集 ────────────────────────
# RSSを出していないプラットフォームが多いため、専用の収集方式を使う。
# scripts/crowdfunding.py が処理する。
crowdfunding:
  enabled: true
  user_agent: "GadgetTerminalBot/1.0 (+https://gadgetterminal.com; contact: info@gadgetterminal.com)"
  request_interval: 1.2      # 秒。相手サーバに負荷をかけないための待ち
  max_pages_per_run: 40      # 1回の実行で開くプロジェクトページの上限

  sources:
    - id: makuake
      name: Makuake
      type: sitemap
      sitemap_index: https://www.makuake.com/sitemap/
      project_pattern: '^https://www\.makuake\.com/project/[^/]+/$'
      scan_sitemaps: 2       # 末尾から何枚のサイトマップを見るか
      tech_filter: true      # 食品・ファッション等を除外する
      category: weird
      tier: 1
      verified: true
      note: |
        robots.txt を確認済み（2026-08-16）。/api/ は禁止、/project/ と /sitemap/ は許可。
        プロジェクトページはサーバー生成なので OGP から題名・説明・画像URLが取れる。

    - id: kickstarter_tech
      name: Kickstarter（Technology）
      type: atom
      url: https://www.kickstarter.com/discover/advanced.atom?category_id=16&sort=newest
      browser_ua: true
      limit: 30
      category: weird
      tier: 1
      note: |
        既定のUAだと 406 を返す。ブラウザ相当のUAで取りに行く。
        それでも弾かれる場合はこのソースだけスキップされ、他は動き続ける。

    - id: kickstarter_gadgets
      name: Kickstarter（Gadgets）
      type: atom
      url: https://www.kickstarter.com/discover/categories/technology/gadgets.atom?sort=newest
      browser_ua: true
      limit: 30
      category: weird
      tier: 1

    - id: campfire
      name: CAMPFIRE
      type: sitemap
      sitemap_index: https://camp-fire.jp/sitemap.xml
      project_pattern: '^https://camp-fire\.jp/projects/\d+/view$'
      scan_sitemaps: 2
      tech_filter: true
      category: weird
      tier: 2
      enabled: false
      note: "未検証。動作を確認できたら enabled を true にする。"

    - id: greenfunding
      name: GREEN FUNDING
      type: sitemap
      sitemap_index: https://greenfunding.jp/sitemap.xml
      project_pattern: '^https://greenfunding\.jp/[^/]+/projects/\d+$'
      scan_sitemaps: 2
      tech_filter: true
      category: weird
      tier: 2
      enabled: false
      note: "未検証。"

