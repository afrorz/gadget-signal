name: サイトをビルドして公開

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "config/site.yaml"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
  # 記事作成ワークフローが終わったら、その後に必ずビルドする。
  # GitHub App が push したコミットは push イベントを発火しないため、これが必要。
  workflow_run:
    workflows: ["毎朝の記事下書きを作って公開"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 日本語フォントを入れる（OGP画像生成に必要）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - run: pip install -r requirements.txt
      - run: python3 scripts/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 公開が終わってから検索エンジンに通知する。
  # 反映前に通知するとクローラーが古い内容を取得してしまうため、必ず deploy の後。
  notify:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write   # xposted.json の記録をコミットするため
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install PyYAML
      - name: IndexNow に通知する
        run: python3 scripts/indexnow.py --days 2
        continue-on-error: true

      - name: X に投稿する
        # 認証情報が未設定なら何もせず終了する。投稿の失敗で公開を巻き戻さない。
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python3 scripts/xpost.py
        continue-on-error: true

      - name: 投稿済みの記録をコミットする
        run: |
          if [ -n "$(git status --porcelain data/xposted.json)" ]; then
            git config user.name "afrorz"
            git config user.email "306337156+afrorz@users.noreply.github.com"
            git add data/xposted.json
            git commit -m "chore: X 投稿済みの記録を更新"
            git push
          fi
        continue-on-error: true
