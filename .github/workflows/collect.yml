name: 日次ダイジェスト収集

on:
  schedule:
    # JST 05:30 (UTC 20:30) — 記事生成(06:00 JST)の30分前。
    # この時刻にしているのは、海外ガジェットのニュースが米国の営業時間
    # (= 日本の深夜〜早朝) に出るため。朝5:30なら米国の丸1日ぶんを拾える。
    - cron: "30 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 収集
        run: python3 scripts/collect.py --top 30

      - name: ダイジェストをコミット
        run: |
          git config user.name  "gadget-signal-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "digest: $(date -u +%Y-%m-%d)"
          git push

      - name: ダイジェストをArtifactとして保存
        uses: actions/upload-artifact@v4
        with:
          name: digest
          path: data/digest/
          retention-days: 30
