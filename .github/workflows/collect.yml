name: 日次ダイジェスト収集

on:
  schedule:
    # JST 07:00 (UTC 22:00) — 米国の夕方＋欧州の深夜ぶんが出そろったタイミング
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 収集
        run: python3 scripts/collect.py --top 30

      - name: ダイジェストをコミット
        run: |
          git config user.name  "gadget-signal-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "digest: $(date -u +%Y-%m-%d)"
          git push

      - name: ダイジェストをArtifactとして保存
        uses: actions/upload-artifact@v4
        with:
          name: digest
          path: data/digest/
          retention-days: 30
